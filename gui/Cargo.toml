[package]
name = "pz-ram-configurator"
version = "2.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[[bin]]
name = "pz-ram-configurator"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rfd = "0.15"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.17.1"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
